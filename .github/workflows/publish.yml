name: Publish website

on:
  push:
    branches: [master]

jobs:
  build:
    if: github.repository_owner == 'w3f'
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Verify Environment
        run: |
          node -v
          yarn -v

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Configure Git Auth
        env:
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: |
          git config --global user.email "grants-deployer@users.noreply.github.com"
          git config --global user.name "grants-deployer"
          git config --global url."https://grants-deployer:${ACCESS_KEY}@github.com/".insteadOf "https://github.com/"

      - name: Deploy
        env:
          GIT_USER: grants-deployer
          PUBLISHING: "true"
        run: yarn deploy

      - name: Notify on Failure
        if: failure()
        uses: fadenb/matrix-chat-message@v0.0.6
        with:
          homeserver: matrix.web3.foundation
          token: ${{ secrets.MATRIX_TOKEN }}
          channel: ${{ secrets.MATRIX_CHANNEL_ID }}
          message: |
            WEBSITE BUILD FAILED
            Branch: master
            Commit: https://github.com/w3f/Grants-Program/commit/${{ github.sha }}
